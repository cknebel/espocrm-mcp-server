services:
  espocrm-mcp:
    build: .
    image: espocrm-mcp-server:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 3000
      MCP_HTTP_PATH: /mcp
      MCP_HTTP_ALLOWED_HOSTS: ${MCP_HTTP_ALLOWED_HOSTS:-espocrm-mcp.example.de,127.0.0.1,localhost}
      MCP_HTTP_ALLOWED_ORIGINS: ${MCP_HTTP_ALLOWED_ORIGINS:-https://chatgpt.com,https://claude.ai}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./logs:/app/logs
      # Optional: mount a custom permissions file and set ESPOCRM_PERMISSIONS_FILE in .env.
      # - ./config/permissions.example.yaml:/app/config/permissions.yaml:ro
