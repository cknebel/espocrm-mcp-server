maxResults: 20
maxOffset: 1000

entities:
  Account:
    readableFields:
      - id
      - name
      - type
      - industry
      - website
      - emailAddress
      - phoneNumber
      - billingAddressCity
      - billingAddressState
      - billingAddressCountry
      - cEnrichment
      - assignedUserId
      - assignedUserName
    listFields:
      - id
      - name
      - type
      - industry
      - billingAddressCity
      - cEnrichment
      - assignedUserId
      - assignedUserName
    writableFields: []
    filterableFields:
      - name
      - type
      - industry
      - billingAddressCity
      - cEnrichment
      - assignedUserId
    orderableFields: [name, type, industry, createdAt, modifiedAt]
    primaryFilters: [customers, resellers, partners, recentlyCreated]

  Contact:
    readableFields:
      - id
      - salutationName
      - firstName
      - middleName
      - lastName
      - title
      - emailAddress
      - phoneNumber
      - doNotCall
      - emailAddressIsOptedOut
      - phoneNumberIsOptedOut
      - accountId
      - accountName
      - accountsIds
      - accountsNames
      - accountRole
      - opportunityRole
      - cRolle
      - cSektor
      - assignedUserId
      - assignedUserName
    listFields:
      - id
      - salutationName
      - firstName
      - lastName
      - title
      - accountId
      - accountName
      - cRolle
      - cSektor
      - assignedUserId
      - assignedUserName
    writableFields: []
    filterableFields:
      - firstName
      - lastName
      - title
      - emailAddress
      - phoneNumber
      - accountId
      - accountsIds
      - accountRole
      - cRolle
      - cSektor
      - assignedUserId
    orderableFields: [firstName, lastName, accountName, createdAt, modifiedAt]
    primaryFilters: [portalUsers, notPortalUsers, accountActive]

  Opportunity:
    readableFields:
      - id
      - name
      - amount
      - amountCurrency
      - accountId
      - accountName
      - contactId
      - contactName
      - contactsIds
      - contactsNames
      - contactRole
      - stage
      - probability
      - leadSource
      - closeDate
      - assignedUserId
      - assignedUserName
    listFields:
      - id
      - name
      - amount
      - amountCurrency
      - accountId
      - accountName
      - stage
      - probability
      - closeDate
      - assignedUserId
      - assignedUserName
    writableFields: []
    filterableFields:
      - name
      - accountId
      - contactId
      - contactsIds
      - stage
      - amount
      - leadSource
      - closeDate
      - assignedUserId
    orderableFields: [name, amount, stage, probability, closeDate, createdAt, modifiedAt]
    primaryFilters: [open, won, lost]

  Email:
    readableFields:
      - id
      - subject
      - from
      - to
      - cc
      - bodyPlain
      - body
      - isHtml
      - status
      - hasAttachment
      - parentId
      - parentType
      - parentName
      - dateSent
      - isAutoReply
      - repliedId
      - repliesIds
      - accountId
      - accountName
    listFields:
      - id
      - subject
      - from
      - to
      - dateSent
      - status
      - hasAttachment
    writableFields: []
    filterableFields: []
    orderableFields: []
    primaryFilters: []

  Meeting:
    readableFields: &eventReadableFields
      - id
      - name
      - status
      - dateStart
      - dateEnd
      - dateStartDate
      - dateEndDate
      - isAllDay
      - description
      - parentId
      - parentType
      - parentName
      - assignedUserId
      - assignedUserName
      - usersIds
      - usersNames
      - contactsIds
      - contactsNames
      - leadsIds
      - leadsNames
      - createdAt
      - modifiedAt
    listFields: &eventListFields
      - id
      - name
      - status
      - dateStart
      - dateEnd
      - dateStartDate
      - dateEndDate
      - isAllDay
      - parentId
      - parentType
      - parentName
      - assignedUserId
      - assignedUserName
    writableFields: &eventWritableFields
      - name
      - status
      - dateStart
      - dateEnd
      - dateStartDate
      - dateEndDate
      - isAllDay
      - description
      - parentId
      - parentType
      - assignedUserId
      - usersIds
      - contactsIds
      - leadsIds
    filterableFields: &eventFilterableFields
      - name
      - status
      - dateStart
      - dateEnd
      - parentId
      - parentType
      - assignedUserId
      - usersIds
      - contactsIds
      - leadsIds
    orderableFields: &eventOrderableFields [name, status, dateStart, dateEnd, createdAt, modifiedAt]
    primaryFilters: &eventPrimaryFilters [planned, held, todays]

  Call:
    readableFields:
      - id
      - name
      - status
      - dateStart
      - dateEnd
      - description
      - parentId
      - parentType
      - parentName
      - assignedUserId
      - assignedUserName
      - usersIds
      - usersNames
      - contactsIds
      - contactsNames
      - leadsIds
      - leadsNames
      - createdAt
      - modifiedAt
      - direction
    listFields:
      - id
      - name
      - status
      - dateStart
      - dateEnd
      - parentId
      - parentType
      - parentName
      - assignedUserId
      - assignedUserName
      - direction
    writableFields:
      - name
      - status
      - dateStart
      - dateEnd
      - description
      - parentId
      - parentType
      - assignedUserId
      - usersIds
      - contactsIds
      - leadsIds
      - direction
    filterableFields:
      - name
      - status
      - dateStart
      - dateEnd
      - parentId
      - parentType
      - assignedUserId
      - usersIds
      - contactsIds
      - leadsIds
      - direction
    orderableFields: *eventOrderableFields
    primaryFilters: *eventPrimaryFilters

  Task:
    readableFields:
      - id
      - name
      - status
      - priority
      - dateStart
      - dateEnd
      - dateStartDate
      - dateEndDate
      - description
      - parentId
      - parentType
      - parentName
      - assignedUserId
      - assignedUserName
      - createdAt
      - modifiedAt
    listFields:
      - id
      - name
      - status
      - priority
      - dateStart
      - dateEnd
      - dateStartDate
      - dateEndDate
      - parentId
      - parentType
      - parentName
      - assignedUserId
      - assignedUserName
    writableFields:
      - name
      - status
      - priority
      - dateStart
      - dateEnd
      - dateStartDate
      - dateEndDate
      - description
      - parentId
      - parentType
      - assignedUserId
    filterableFields:
      - name
      - status
      - priority
      - dateStart
      - dateEnd
      - parentId
      - parentType
      - assignedUserId
    orderableFields: [name, status, priority, dateStart, dateEnd, createdAt, modifiedAt]
    primaryFilters: [actual, completed, deferred, todays, overdue]
